[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dose3d-canister"
version = "0.1.0"
description = "Reconstruct a 3D dose map inside a blood-irradiator canister from discrete dosimeter points."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Dadalt Morero" }]
keywords = ["dosimetry", "blood-irradiation", "canister", "interpolation"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "pillow>=10",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
pyvista = ["pyvista>=0.43"]
dev = ["pytest>=8"]

[project.scripts]
dose3d-canister = "dose3d_canister.cli:main"

[project.urls]
Homepage = "https://github.com/ldadalt/dose3d-canister"
Repository = "https://github.com/ldadalt/dose3d-canister"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
